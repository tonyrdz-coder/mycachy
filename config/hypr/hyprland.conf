# mycachy — hyprland.conf
# Catppuccin Mocha

################
### MONITORS ###
################

monitor = , preferred, auto, 1

###############
### ENV ###
###############

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244ff)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = true
    dim_strength = 0.1

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease, slide
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, ease, slide
    animation = border, 1, 5, ease
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = JetBrainsMono Nerd Font
}

cursor {
    no_hardware_cursors = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true
    accel_profile = flat

    touchpad {
        clickfinger_behavior = true
        scroll_factor = 0.4
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_create_new = false
}

#################
### KEYBINDS ###
#################

$mod = SUPER

# Applications
bind = $mod, Return, exec, foot
bind = $mod SHIFT, Return, exec, firefox
bind = $mod SHIFT, F, exec, foot -e yazi
bind = $mod SHIFT, N, exec, foot -e nvim
bind = $mod SHIFT, T, exec, rfkill unblock bluetooth && foot --app-id floating -e bluetui
bind = $mod SHIFT, W, exec, rfkill unblock wifi && foot --app-id floating -e sudo impala

# Launcher
bind = $mod, Space, exec, walker

# Clipboard picker
bind = $mod, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy

# Screenshots
bind = $mod SHIFT, S, exec, hyprshot -m region
bind = , Print, exec, hyprshot -m output

# Power menu
bind = $mod, Escape, exec, walker -m power

# Keybindings viewer
bind = $mod, slash, exec, mycachy-keybindings

# Window management
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, P, pseudo
bind = $mod ALT, J, togglesplit

# Focus — vim keys + arrows
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Resize windows
binde = $mod ALT, H, resizeactive, -50 0
binde = $mod ALT, L, resizeactive, 50 0
binde = $mod ALT, K, resizeactive, 0 -50

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Scroll through workspaces with mouse on bar
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media keys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

####################
### WORKSPACES ###
####################

workspace = 1, persistent = true
workspace = 2, persistent = true
workspace = 3, persistent = true
workspace = 4, persistent = true
workspace = 5, persistent = true

####################
### WINDOW RULES ###
####################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(floating)$
windowrulev2 = size 900 600, class:^(floating)$
windowrulev2 = center, class:^(floating)$
